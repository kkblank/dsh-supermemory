# dsh-supermemory — DSH 记忆插件（bundle patch）
#
# 把插件挂进 profile 的配置树。name 必须与安装后的包名完全一致。
#
# 安装（在 DSH 运行中也可，通过 plugin_manager install_bundle 指向本目录）：

- insert:
    - id: supermemory
      name: dsh-supermemory
      config:
        enabled: true
        # 人设根目录留空 = $DSH_HOME/supermemory/personas
        # personasRoot: ''
        systemPromptMaxBytes: 12000
        injectMaxBytes: 24000
        autoDigest: true
        digestEveryTurns: 5
        # 整理模型（本机 vllm/qwen）是推理模型：输出预算要先给思考用完才轮到正文。实测思考约
        # 需 6000 tokens，故预算必须远大于正文本身，否则思考没写完就截断、正文为空。
        # 输入也别塞满：整理不需要 256K 窗口，输入越小思考越短、也越省。
        digestMaxInputBytes: 24000
        digestMaxOutputTokens: 8000
        digestPressureRatio: 0.75
        # 子智能体默认不带记忆。写显式 false 是为了让默认值在配置文件里可见，不必去翻
        # zod default。实测本机 link 安装方式下配置树从未落过 supermemory 的 config 段，
        # 删掉这行走的是 zod 新默认值，不会被残留旧值压住；但若日后改成复制到 profile
        # 的安装方式，显式写出依然是更安全的一侧（契约 §V3.8）。
        injectIntoSubagents: false
        # 整编（契约 §V4.0）：project 记忆条目数或体积达标后，下一次整理升级为整编模式，
        # 产物是整份目标态而非增量；落盘前先把原文快照到 .dsh/memory/history/。
        # 阈值只在这里配，面板不提供（§V4.0.4）。
        digestConsolidate: true
        digestConsolidateMinEntries: 20
        digestConsolidateMinBytes: 12288
        digestConsolidateCooldownMs: 21600000
        # 整编要重写整份记忆，思考量比追加模式大得多，而且**与待重述的记忆规模成正比**：
        # 实测正文 1683 字节配 5942 tokens 思考（约 9 倍），当时给 16000 够用；
        # 记忆长到 32 条 / 12KB 后需重述全部条目，思考量按同比例约 49k tokens，16000 被吃穿、
        # 正文一个字没产出，报错表现为「输出被 maxTokens 截断」。
        # 本值是显式配置，会压住 config.js 的 zod default（改默认值对本机无效，只影响新用户）。
        # v11（契约 §V11.0.3）：记忆再长**优先靠分批降精压单轮规模**，而不是继续上调本值——
        # 规模线性增长时，调大预算只是把悬崖往后推。下面 5 项就是那个机制。
        digestConsolidateMaxOutputTokens: 60000
        digestSnapshotKeep: 3
        # 整编分批降精（契约 §V11.0.3）：条目数超 30 后，一轮只整理一批主题（每批最多 5 个），
        # 超 60 条改用更大的批（每批最多 8 个）。未达 30 条时行为与旧版逐字节相同。
        # 批次优先挑「又大又冷」的主题：降精收益最高、风险最低。
        digestTieredConsolidate: true
        digestTier2MinEntries: 30
        digestTier3MinEntries: 60
        digestTier2BatchTopics: 5
        digestTier3BatchTopics: 8
